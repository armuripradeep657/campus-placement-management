<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SIMATS CPMS Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-4 bg-cover bg-center" 
      style="background-image: url('/simats-bg.webp'), url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1920&q=80');">
    
    <!-- Dark glass-friendly shading overlay -->
    <div class="absolute inset-0 bg-black/55 z-0"></div>

    <div class="relative z-10 w-full max-w-md bg-transparent border border-white/35 rounded-3xl p-8 flex flex-col">
        
        <div class="text-center mb-6 text-white">
            <div class="mx-auto bg-white/20 border border-white/30 rounded-full p-3.5 w-16 h-16 flex items-center justify-center mb-3">
                <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/>
                </svg>
            </div>
            <h1 class="text-xl font-extrabold tracking-wider uppercase">SIMATS JAVA</h1>
            <p class="text-xs text-white/85 font-semibold uppercase tracking-wide mt-1">PLACEMENT COORDINATOR BOARD</p>
        </div>

        <!-- System Alerts -->
        <div th:if="${error}" class="mb-4 bg-rose-955 bg-rose-950/40 border border-rose-500/30 text-rose-200 p-3 rounded-2xl text-xs font-semibold text-center">
            <span th:text="${error}">An authentication challenge error has occurred.</span>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-white/90 uppercase mb-2">Coordinator Username</label>
                <input type="text" name="username" required placeholder="192472118"
                       class="w-full bg-transparent border-2 border-white/30 text-white placeholder-white/35 text-xs py-2.5 px-4 rounded-xl focus:outline-none focus:border-white/60 transition" />
            </div>

            <div>
                <label class="block text-xs font-bold text-white/90 uppercase mb-2">Coordinator Password</label>
                <input type="password" name="password" required placeholder="••••"
                       class="w-full bg-transparent border-2 border-white/30 text-white placeholder-white/35 text-xs py-2.5 px-4 rounded-xl focus:outline-none focus:border-white/60 transition" />
            </div>

            <button type="submit" 
                    class="w-full py-3 mt-2 bg-blue-600 hover:bg-blue-750 hover:bg-blue-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition cursor-pointer">
                Access Java Desk
            </button>
        </form>

        <div class="mt-6 text-center border-t border-white/10 pt-4 text-[10px] text-white/60 uppercase">
            Authorized SIMATS placement credentials apply: <span class="font-bold text-white/80">192472118</span> / <span class="font-bold text-white/80">2118</span>
        </div>

    </div>
</body>
</html>
